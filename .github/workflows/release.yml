name: リリース

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: ビルド・検証・公開
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: ソースを取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: .NET 10を準備
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Dalamudの開発ファイルを取得
        run: |
          $dalamudDirectory = Join-Path $env:RUNNER_TEMP 'dalamud'
          $archivePath = Join-Path $env:RUNNER_TEMP 'dalamud.zip'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/goatcorp/dalamud-distrib/main/latest.zip' -OutFile $archivePath
          Expand-Archive -LiteralPath $archivePath -DestinationPath $dalamudDirectory
          "DALAMUD_HOME=$dalamudDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: タグと配布定義を検証
        run: ./scripts/Test-PluginRepository.ps1 -ReleaseTag $env:GITHUB_REF_NAME

      - name: ビルド・テスト・配布ZIPを検証
        run: ./scripts/Build.ps1

      - name: GitHub Releaseへ公開
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $notesPath = Join-Path 'docs/releases' "$env:GITHUB_REF_NAME.md"
          if (!(Test-Path -LiteralPath $notesPath)) { throw "リリースノートがありません: $notesPath" }
          gh release create $env:GITHUB_REF_NAME './artifacts/latest.zip' --verify-tag --title "Arctis GameBuds Battery $env:GITHUB_REF_NAME" --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Releaseの公開に失敗しました。' }
